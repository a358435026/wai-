name: Tongchuan
options:
  bundleIdPrefix: app.tongchuan
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
targets:
  Tongchuan:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tongchuan.personal
        PRODUCT_NAME: Tongchuan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 随声同传
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于将你说的话实时翻译成字幕和语音。音频会传至你配置的火山引擎服务。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
  TongchuanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UITests
    dependencies:
      - target: Tongchuan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tongchuan:
    build:
      targets:
        Tongchuan: all
    test:
      targets:
        - TongchuanUITests
