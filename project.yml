name: Tongchuan
options:
  bundleIdPrefix: app.tongchuan
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Tongchuan:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tongchuan.personal
        PRODUCT_NAME: Tongchuan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ����ͬ��
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ���ڽ���˵�Ļ�ʵʱ�������Ļ����������Ƶ�ᴫ�������õĻ�ɽ�������
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
  TongchuanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/UITests
    dependencies:
      - target: Tongchuan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tongchuan:
    build:
      targets:
        Tongchuan: all
    test:
      targets:
        - TongchuanUITests
