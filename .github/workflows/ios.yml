name: iOS build and test
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and simulator environment
        run: |
          xcodebuild -version
          swift --version
      - name: Test official protocol interoperability and audio framing
        run: swift test
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone archive
        run: |
          xcodebuild archive -project Tongchuan.xcodeproj -scheme Tongchuan \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Tongchuan.xcarchive IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO
          mkdir -p build/unsigned/Payload
          cp -R build/Tongchuan.xcarchive/Products/Applications/Tongchuan.app build/unsigned/Payload/
          cd build/unsigned
          ditto -c -k --keepParent Payload ../Tongchuan-iOS15-unsigned.ipa
      - name: Verify real iPhone binary supports iOS 15.4.1
        run: |
          python3 tools/verify_ipa.py build/Tongchuan-iOS15-unsigned.ipa \
            --max-minimum-ios 15.4.1 --expected-version 0.1.1 | tee build/ipa-verification.json
      - name: Select available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Simulator launch and settings test
        run: |
          xcodebuild test -project Tongchuan.xcodeproj -scheme Tongchuan \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/UITests.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Upload unsigned app and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tongchuan-iOS
          path: |
            build/Tongchuan-iOS15-unsigned.ipa
            build/ipa-verification.json
            build/UITests.xcresult
          retention-days: 7
