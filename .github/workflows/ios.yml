name: iOS build and test
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record Xcode and simulator environment
        run: |
          xcodebuild -version
          swift --version
      - name: Test official protocol interoperability and audio framing
        run: swift test
      - name: Generate Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone archive
        run: |
          xcodebuild archive -project Tongchuan.xcodeproj -scheme Tongchuan \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Tongchuan.xcarchive IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO
          mkdir -p build/unsigned/Payload
          cp -R build/Tongchuan.xcarchive/Products/Applications/Tongchuan.app build/unsigned/Payload/
          cd build/unsigned
          ditto -c -k --keepParent Payload ../Tongchuan-iOS15-unsigned.ipa
      - name: Verify real iPhone binary supports iOS 15.4.1
        run: |
          python3 tools/verify_ipa.py build/Tongchuan-iOS15-unsigned.ipa \
            --max-minimum-ios 15.4.1 --expected-version 0.6.0 | tee build/ipa-verification.json
      - name: Upload verified iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tongchuan-iOS15-IPA
          path: |
            build/Tongchuan-iOS15-unsigned.ipa
            build/ipa-verification.json
          retention-days: 7
      - name: Select available iPhone simulator
        timeout-minutes: 3
        run: |
          xcrun simctl list devices available -j > build/simulators.json
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          python3 tools/select_simulator.py build/simulators.json "$SDK_VERSION" >> "$GITHUB_ENV"
      - name: Boot selected simulator
        timeout-minutes: 10
        run: |
          SIMULATOR_ID=$(xcrun simctl create Tongchuan-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$SIMULATOR_RUNTIME")
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Simulator launch and settings test
        timeout-minutes: 20
        run: |
          xcodebuild test -project Tongchuan.xcodeproj -scheme Tongchuan \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/UITests.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=""
      - name: Upload unsigned app and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tongchuan-iOS15-tests
          path: |
            build/UITests.xcresult
          retention-days: 7
